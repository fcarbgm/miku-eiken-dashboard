  const out=[]; let cur=null, sect="";

  }
  if(cur&&cur.words.length) out.push(cur);
  out.forEach(l=>{
    for(let i=0;i<l.words.length;i++){
      let t=l.words[i].t.trim();
      if(/\($/.test(t)&&l.words[i+1]){ t=t.replace(/\s*\($/,""); l.words[i+1].t="("+l.words[i+1].t.trim(); }
      l.words[i].t=t;
    }
    l.words=l.words.filter(w=>w.t!=="");
    l.s=l.words[0].s; l.e=l.words[l.words.length-1].e;
  });
  return out.filter(l=>l.words.length);
}
function buildLine(el,line){
  el.innerHTML="";
  line.words.forEach(w=>{
    const sp=document.createElement("span");
    const isJa=/[぀-ヿ一-龯]/.test(w.t);
    const g=G[clean(w.t)];
    sp.className="kw"+(isJa?" jp":"")+(g?" tgt":"");
    sp.textContent=w.t;
    if(g&&showGloss){ const i=document.createElement("i"); i.className="gl"; i.textContent=g; sp.appendChild(i); }
    el.appendChild(sp);
  });
}
function showLine(i){
  curIdx=i; const L=lines[i];
  $("sect").textContent=L?L.sect:"";
  buildLine($("cur"),L);
  const N=lines[i+1];
  $("nxt").textContent=N?N.words.map(w=>w.t).join(" "):"";
  const [a,b]=HUE[key]||[200,240], h=a+Math.random()*(b-a);
  $("bg").style.background=`radial-gradient(125% 95% at 50% 8%, hsl(${h} 58% 19%), #070a12 74%)`;
}
function paint(t){
  const L=lines[curIdx]; if(!L) return;
  const sp=$("cur").children;
  for(let i=0;i<L.words.length;i++){
    const w=L.words[i], el=sp[i]; if(!el) continue;
    let p=0;
    if(t>=w.e) p=100; else if(t>w.s) p=Math.max(0,Math.min(100,(t-w.s)/Math.max(w.e-w.s,.001)*100));
    el.style.setProperty("--p",p+"%");
    el.classList.toggle("live",t>=w.s&&t<=w.e);
  }
}
function pips(t){
  const n=lines[curIdx+1], box=$("pips");
  if(!n){ box.innerHTML=""; return; }
  const gap=n.s-t;
  if(gap>0&&gap<2.2){ const k=Math.ceil(gap/0.55);
    box.innerHTML=[0,1,2,3].map(j=>`<span class="pip ${j<k?"on":""}"></span>`).join(""); }
  else box.innerHTML="";
}
function rain(){
  if(audio.paused||!rainWords.length) return;
  const w=rainWords[Math.floor(Math.random()*rainWords.length)];
  const e=document.createElement("div"); e.className="rw"; e.textContent=w;
  e.style.left=(Math.random()*88)+"%"; e.style.top=(60+Math.random()*38)+"%";
  e.style.fontSize=(.9+Math.random()*2)+"rem";
  e.style.color=Math.random()<.5?"#7dffb0":"#63e0ff";
  e.style.animationDuration=(2.6+Math.random()*2)+"s";
  $("rain").appendChild(e); setTimeout(()=>e.remove(),5000);
}
setInterval(rain,240);
function tick(){
  const t=audio.currentTime;
  let i=-1; for(let k=0;k<lines.length;k++){ if(t>=lines[k].s-0.45) i=k; else break; }
  if(i!==curIdx&&i>=0) showLine(i);
  if(i>=0) paint(t);
  pips(t);
  $("barFill").style.width=(t/(audio.duration||1)*100)+"%";
  requestAnimationFrame(tick);
}
function load(k){
  key=k; const song=DATA[k];
  lines=parse(song.w); curIdx=-1;
  rainWords=[...new Set(lines.flatMap(l=>l.words).map(w=>clean(w.t)).filter(w=>G[w]))];
  audio.src="https://cdn1.suno.ai/"+song.id+".mp3"; audio.load();
  audio.playbackRate=parseFloat($("rate").value); audio.loop=looping;
  $("cur").innerHTML=""; $("nxt").textContent=""; $("sect").textContent="";
  localStorage.setItem("kara_last",k);
}
function jump(d){
  const ks=Object.keys(DATA).sort(); let i=ks.indexOf(key)+d;
  if(i<0)i=ks.length-1; if(i>=ks.length)i=0;
  $("sel").value=ks[i]; audio.pause(); $("play").textContent="▶ 再生"; load(ks[i]);
}
(async function(){
  try{
    DATA=await fetch(ALIGN_URL+"?c="+Date.now(),{cache:"no-store"}).then(r=>r.json());
    const ks=Object.keys(DATA).sort();
    $("sel").innerHTML=ks.map(k=>`<option value="${k}">${DATA[k].title}</option>`).join("");
    const last=localStorage.getItem("kara_last");
    const start=(last&&DATA[last])?last:ks[0];
    $("sel").value=start; load(start);
    $("load").style.display="none"; tick();
  }catch(e){ $("load").textContent="⚠️ 読み込み失敗。通信を確認してね"; }
})();
$("sel").onchange=e=>{ audio.pause(); $("play").textContent="▶ 再生"; load(e.target.value); };
$("play").onclick=()=>{ if(audio.paused){audio.play();$("play").textContent="⏸ 停止";} else {audio.pause();$("play").textContent="▶ 再生";} };
$("rate").onchange=e=>audio.playbackRate=parseFloat(e.target.value);
$("loop").onclick=()=>{ looping=!looping; audio.loop=looping; $("loop").classList.toggle("on",looping); };
$("glossBtn").onclick=()=>{ showGloss=!showGloss; $("glossBtn").classList.toggle("on",showGloss);
  $("glossBtn").textContent=showGloss?"🇯🇵 意味 ON":"🇯🇵 意味 OFF"; if(curIdx>=0) showLine(curIdx); };
$("prev").onclick=()=>jump(-1); $("next").onclick=()=>jump(1);
$("bar").onclick=e=>{ const r=$("bar").getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*(audio.duration||1); curIdx=-1; };
$("stage").onclick=()=>$("play").click();
addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault();$("play").click();}
  if(e.code==="ArrowRight")jump(1); if(e.code==="ArrowLeft")jump(-1); });
audio.onended=()=>{ if(!looping){$("play").textContent="▶ 再生";curIdx=-1;} };
</script>
</body>
