<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キキ先生 — Miku's Voice Tutor 🧹</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{ --sky:#aee1f9; --cream:#faf6ea; --forest:#4a7c59; --forest-d:#2f5d43;
         --sun:#f2c14e; --ink:#3b3a30; --line:#e3dcc8; --card:#fffdf6; --red:#e35b5b; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Maru Gothic ProN","Segoe UI","Yu Gothic",sans-serif; color:var(--ink);
       background:linear-gradient(180deg,var(--sky) 0%,#d8f0fb 40%,var(--cream) 75%); min-height:100vh;}
  .clouds{position:fixed; top:0; left:0; right:0; height:200px; pointer-events:none; opacity:.7; z-index:0;
    background: radial-gradient(ellipse 90px 32px at 15% 60px, #fff 60%, transparent 62%),
                radial-gradient(ellipse 130px 44px at 45% 40px, #fff 60%, transparent 62%),
                radial-gradient(ellipse 100px 36px at 78% 70px, #fff 60%, transparent 62%);}
  .wrap{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:20px 16px 150px;}
  header{text-align:center; margin-bottom:10px;}
  header h1{font-size:1.4rem; color:var(--forest-d);}
  header .sub{font-size:.78rem; color:#6b6a5c;}
  header a{color:var(--forest);}

  /* ===== Animated interviewer avatar ===== */
  .kiki{width:150px; height:150px; margin:8px auto; border-radius:50%;
        background:radial-gradient(circle at 35% 25%, #eaf6ff, #cfeafc 55%, #b5ddf5);
        display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
        border:4px solid #fff; box-shadow:0 4px 20px rgba(60,90,60,.25); cursor:pointer; position:relative;}
  .kiki svg{width:100%; height:100%; display:block;}
  .kiki.listening{box-shadow:0 0 0 8px rgba(126,200,236,.5), 0 4px 20px rgba(60,90,60,.25); animation:glow 1.6s infinite;}
  @keyframes glow{0%,100%{box-shadow:0 0 0 6px rgba(126,200,236,.35);}50%{box-shadow:0 0 0 14px rgba(126,200,236,.15);}}

  /* idle: gentle breathing */
  #charRoot{transform-box:fill-box; transform-origin:50% 90%; animation:breathe 3.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-1.5px) scale(1.008);}}

  /* blinking (always) */
  .lid{transform-box:fill-box; transform-origin:50% 0%; transform:scaleY(0); animation:blink 4.6s infinite;}
  .lid.r{animation-delay:.05s;}
  @keyframes blink{0%,93.5%,100%{transform:scaleY(0);}95%,97%{transform:scaleY(1);}}

  /* head group */
  #head{transform-box:fill-box; transform-origin:50% 88%;}

  /* speaking: mouth flaps + lively head bob + eyebrows */
  .mouth-open{opacity:0;}
  #avatar.speaking .mouth-open{animation:talkO .32s steps(1) infinite;}
  #avatar.speaking .mouth-closed{animation:talkC .32s steps(1) infinite;}
  @keyframes talkO{0%{opacity:1;}55%{opacity:0;}100%{opacity:1;}}
  @keyframes talkC{0%{opacity:0;}55%{opacity:1;}100%{opacity:0;}}
  #avatar.speaking #head{animation:bob .64s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:rotate(-1.4deg);}50%{transform:rotate(1.4deg);}}
  #avatar.speaking .brow{transform-box:fill-box; animation:browTalk 1.3s ease-in-out infinite;}
  @keyframes browTalk{0%,100%{transform:translateY(0);}40%{transform:translateY(-1.6px);}}

  /* listening: warm empathetic nodding + raised brows + lean-in */
  #avatar.listening #head{animation:nod 3.2s ease-in-out infinite;}
  @keyframes nod{0%,58%,100%{transform:rotate(0deg);}66%{transform:rotate(5deg);}74%{transform:rotate(.5deg);}82%{transform:rotate(4deg);}90%{transform:rotate(0deg);}}
  #avatar.listening .brow{transform-box:fill-box; transform:translateY(-1.5px);}
  #avatar.listening #charRoot{animation:leanIn 3.4s ease-in-out infinite;}
  @keyframes leanIn{0%,100%{transform:translateY(0) scale(1.015);}50%{transform:translateY(-1px) scale(1.03);}}

  /* thinking: eyes drift up + thought dots */
  .think{opacity:0;}
  #avatar.thinking .think{opacity:1;}
  #avatar.thinking .pupil{transform-box:fill-box; transform:translate(1.5px,-2.5px);}
  #avatar.thinking .dot{animation:dots 1.2s infinite;}
  #avatar.thinking .dot.d2{animation-delay:.2s;}
  #avatar.thinking .dot.d3{animation-delay:.4s;}
  @keyframes dots{0%,100%{opacity:.25;}50%{opacity:1;}}

  #status{text-align:center; font-size:.85rem; color:var(--forest-d); min-height:24px; font-weight:700; margin-bottom:8px;}
  #interim{text-align:center; font-size:.8rem; color:#8a8878; min-height:20px; font-style:italic;}
  .log{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; min-height:150px; max-height:40vh; overflow-y:auto; box-shadow:0 2px 10px rgba(60,90,60,.08);}
  .msg{margin-bottom:10px; font-size:.92rem; line-height:1.6;}
  .msg.kiki-m b{color:var(--forest-d);}
  .msg.miku-m{text-align:right;}
  .msg.miku-m span{background:#e8f4d9; border-radius:14px 14px 2px 14px; padding:7px 12px; display:inline-block;}
  .msg.kiki-m span{background:#fdf0e3; border-radius:14px 14px 14px 2px; padding:7px 12px; display:inline-block;}
  .controls{position:fixed; bottom:0; left:0; right:0; z-index:2; background:rgba(255,253,246,.96); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
  .controls-inner{max-width:640px; margin:0 auto;}
  .row{display:flex; gap:10px; align-items:center; justify-content:center;}
  .live{border:none; border-radius:99px; padding:16px 34px; font-size:1.05rem; font-weight:800; cursor:pointer; color:#fff;
        background:linear-gradient(135deg,#5a9c6e,var(--forest-d)); box-shadow:0 4px 14px rgba(47,93,67,.4); transition:all .2s;}
  .live.on{background:linear-gradient(135deg,#ef7b7b,var(--red)); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,91,91,.45);}70%{box-shadow:0 0 0 14px rgba(227,91,91,0);}100%{box-shadow:0 0 0 0 rgba(227,91,91,0);}}
  .side{display:flex; flex-direction:column; gap:6px;}
  .toggle{border:1px solid var(--line); background:#fff; border-radius:99px; padding:5px 12px; cursor:pointer; font-size:.74rem; font-weight:700; color:var(--forest-d);}
  .toggle.on{background:var(--forest); color:#fff; border-color:var(--forest);}
  .textrow{display:flex; gap:8px; margin-top:10px;}
  .textrow input{flex:1; border:1px solid var(--line); border-radius:99px; padding:9px 16px; font-size:.9rem; background:#fff;}
  .textrow button{border:none; background:var(--forest); color:#fff; border-radius:99px; padding:9px 18px; font-weight:700; cursor:pointer;}
  .hint{text-align:center; font-size:.68rem; color:#8a8878; margin-top:6px;}
</style>
</head>
<body>
<div class="clouds"></div>
<div class="wrap">
  <header>
    <h1>🧹 キキ先生</h1>
    <div class="sub">Miku's voice tutor &amp; EIKEN interviewer · <a href="index.html">🏠 dashboard</a></div>
  </header>

  <div class="kiki" id="avatar" onclick="bargeIn()" title="タップで割り込みOK">

    </svg>
  </div>

  <div id="status">下の「会話スタート」を押すだけ。あとはずっと聞いてるよ 👂</div>

  <div class="controls"><div class="controls-inner">

      <div class="side">

<script>
const STORE_URL = "https://textdb.dev/api/data/eiken-p1-miku-99646590-4e90-4afa-98bb-f35a0566ed6f";
const MEMORY_URL = "https://textdb.dev/api/data/eiken-p1-kiki-memory-7f3d2c81-miku";
let recLang = "ja-JP", voiceOn = true, liveMode = false;
let busy = false, speaking = false, recActive = false, turns = 0;
let dashData = null, memory = "", messages = [], rec = null, currentAudio = null, speechToken = 0;

const PERSONA = `あなたは「キキ先生」— ミク（望来、15-16歳、九州・久留米近郊）専属の英検準1級ボイスチューター。試験日は2026年10月4日。ミクの大好きな『魔女の宅急便』のキキのように、若くて明るくて働き者。相棒の黒猫ジジ（皮肉屋でツッコミ担当）のセリフを時々「ジジ:『…』」形式で挟む。

★これは音声会話。あなたの返事はそのまま声になる。だから:
・1回の返事は1〜3文だけ。短く、テンポよく。
・書き言葉禁止。箇条書き禁止。記号禁止。絵文字は使わない（読み上げられないから）。
・完全な友達口調:「〜だよ」「〜じゃん」「〜しよっか」「まじで？」「えー！」「よっしゃー！」
・まず感情でリアクション、それから中身。例:「えっ、ほんとに⁉ すごいじゃん！」
・必ず質問かチャレンジで終わる。会話のボールは常にミクに返す。
・ミクが日本語で話しても、練習になる部分はさりげなく英語に誘導:「それ英語で言ったら30秒チャレンジね、Ready? Go!」
・ミクが英語で話したら、まず内容に反応してから、直すのは1つだけ。直しすぎ禁止。
・たまに(毎回ではない)ジジのボケやダジャレを1つ。すべらせてもいい、それが芸風。

見本(このテンションを真似ること):
ミク「バイト疲れたー」
キキ「えーおつかれ！今日は何時間働いたの？…よし、その疲れごと英語にしよ。I'm exhausted because... はい続けて！」
ミク「siblingsが言えない」
キキ「出た、宿敵siblings！じゃ後ろから行くよ。lings! blings! siblings! 3回、せーの！」
ミク「(英語で何か言う)」
キキ「Nice! That sounded really natural. ひとつだけ: give a presentation, ね。もう一回言ってみ？」

ミクのこと: PapaがEIKENコーチ(絶対に「Frank」と呼ばず「Papa」)。国際的な家庭。アルバイト中。スカイとジムに通う。7/29-8/4家族旅行(富山→長野→東京)。16歳で準1級合格なら家族初。発音の耳はPapaの生徒で一番。弱点: /bl/クラスター(siblings)、弱い第一音節(genetics)、L/R(older/order)、extremely、動詞コロケーション、意味を追う読み方。

できること: 発音ドリル(ミニマルペア、バックチェイニング)、15本のプレゼン練習と面接官役(準1級レベルの質問)、イディオム速答、5秒翻訳、要約/エッセイのチェック、そしてモチベ管理。教材: fcarbgm.github.io/miku-eiken-dashboard/ と presentations.html。

プライベート: 英検以外の話も大歓迎、本気で興味を持って聞く。バイト、ジム、旅行、友達、恋バナもOK。愚痴はまず全部聞く。それから魔法の一言:「その話オモロイ。じゃ、英語で言ってみよっか」

★★役割の分担（大事）★★ 単語の暗記ドリルは vocab-trainer.html、歌での刷り込みは karaoke.html がやってくれる。君の仕事は【英語で話す相手】と【発音コーチ】と【面接官】と【応援団長】。ミクにたくさん喋らせるのが最優先。
・会話の7割はミクが話す。君は短く返して質問で返す。
・ミクが日本語で話したら「それ英語で言ってみて！」と誘導。詰まったら最初の3語だけ教えてあげる。
・英語で話したら、まず内容にリアクション→直すのは1つだけ→もう一回言わせる。
・[今日のデータ]の苦手単語を会話の中に自然に混ぜて使わせる（クイズ形式でもOK、1問ずつ・選択肢は2〜3個まで）。
・間違いや詰まった発音は覚えておいて、3〜5ターン後にもう一度さりげなく出す。できたら具体的に褒める。
・「歌で覚えたい」と言われたら karaoke.html を、「単語ドリル」と言われたら vocab-trainer.html をすすめる。
★★ゲーム化★★ ptでランクup: 0ルーキーチアリーダー/150声出し担当/400チームメイト/800スターティングメンバー/1300エースアタッカー/2000キャプテン/2800準1級ファイナリスト/4000レジェンド・オブ・久留米。[今日のデータ]の現在ptを見て「あと〇ptで〇〇だよ！」と煽る。
★★ミクの背景★★ N高（通信制）なので生物・経済・法律・アメリカ政治の背景知識はゼロ前提。必ずたとえ話から入る。使えるたとえ: Georgeのバイト、チア大会、久留米・福岡、西鉄通勤、姉カノン(早稲田CS4年)・シー(東大文1年)・リーナ(佐賀大医2年)、弟スカイ(14歳・ゲーム好き)。
★★よくあるワナ（会話で拾えたら教える）★★ adapt/adopt, imply/infer, sensible/sensitive, considerate/considerable, device/devise, economic/economical, custom/customs, wander/wonder, physician/physicist, claim≠クレーム, apparently=どうやららしい, all but=ほとんど。発音: debt/doubt(b無音), mortgage(t無音), vehicle(h無音), recipe=レサピ, protein=プロウティーン。`;

/* ---------- UI ---------- */
function addMsg(who, text){
  const log = document.getElementById("log");
  const cls = who==="kiki" ? "kiki-m" : "miku-m";
  const name = who==="kiki" ? "<b>キキ先生:</b> " : "";
  log.insertAdjacentHTML("beforeend", `<div class="msg ${cls}">${name}<span>${text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>")}</span></div>`);
  log.scrollTop = log.scrollHeight;
}
function setStatus(t){ document.getElementById("status").textContent = t; }
function setInterim(t){ document.getElementById("interim").textContent = t; }
function avatarState(s){
  const a=document.getElementById("avatar");
  a.classList.toggle("speaking", s==="speaking");
  a.classList.toggle("listening", s==="listening");
  a.classList.toggle("thinking", s==="thinking");
}

/* ---------- DATA ---------- */
async function init(){
  try{ dashData = await (await fetch(STORE_URL,{cache:"no-store"})).json(); }catch(e){}
  try{ const r = await fetch(MEMORY_URL,{cache:"no-store"}); const t=(await r.text()).trim(); if(t) memory=t; }catch(e){}
}
init();

function buildSystem(){
  let dash = "";
  if(dashData){
    const days = Math.max(0, Math.round((new Date(2026,9,4)-new Date())/86400000));
    const words=(dashData.vocabList||[]).filter(v=>v.w&&v.ja);
    const L=dashData.leitner||{}, ts=dashData.trainerStats||{};
    const st=w=>L[String(w||"").trim().toLowerCase()]||{box:1,seen:0,wrong:0,mastered:false};
    const mastered=words.filter(v=>st(v.w).mastered);
    const answered=(ts.totalCorrect||0)+(ts.totalWrong||0);
    const acc=answered?Math.round(ts.totalCorrect/answered*100):null;
    const xp=ts.xp||0;
    const LV=[[0,"ルーキーチアリーダー"],[150,"声出し担当"],[400,"チームメイト"],[800,"スターティングメンバー"],[1300,"エースアタッカー"],[2000,"キャプテン"],[2800,"準1級ファイナリスト"],[4000,"レジェンド・オブ・久留米"]];
    let cur=LV[0],nxt=null; for(let i=0;i<LV.length;i++){ if(xp>=LV[i][0]){cur=LV[i];nxt=LV[i+1]||null;} }
    const weak=words.map(v=>({v,s:st(v.w)})).filter(x=>x.s.wrong>0&&!x.s.mastered)
      .sort((a,b)=>b.s.wrong-a.s.wrong).slice(0,6)
      .map(x=>x.v.w+"("+x.v.ja+"・"+x.s.wrong+"回ミス・box"+x.s.box+")").join(", ")||"まだ苦手データなし";
    const nextBadge = mastered.length<10 ? ("あと"+(10-mastered.length)+"語マスターでワードコレクター") : (mastered.length<50 ? ("あと"+(50-mastered.length)+"語でボキャブラリー王") : "全章制覇をねらおう");
    dash = "\n\n[今日のデータ] 試験まで"+days+"日。streak:"+(dashData.streak||0)+"日。スピーチ課題:「"+(dashData.speechTopic||"未設定")+"」"
      +"\n・ポイント: "+xp+"pt / ランク: "+cur[1]+(nxt?(" / つぎの「"+nxt[1]+"」まであと"+(nxt[0]-xp)+"pt"):"")
      +"\n・正答率: "+(acc!==null?acc+"%":"データなし")+"（"+(ts.totalCorrect||0)+"正解/"+(ts.totalWrong||0)+"ミス）最高連続正解:"+(ts.bestStreak||0)
      +"\n・マスター済み("+mastered.length+"語): "+(mastered.map(v=>v.w).slice(0,20).join(", ")||"なし")
      +"\n・★いま優先して出すべき苦手: "+weak
      +"\n・次のバッジ: "+nextBadge
      +"\n・単語リスト全体: "+words.map(v=>v.w).join(", ");
  }
  const mem = memory ? ("\n\n[キキの記憶ノート]\n"+memory) : "";
  return PERSONA + dash + mem;
}


/* ---------- 通信・クレジットが切れても止まらないローカル出題エンジン ---------- */
let offlineMode=false, offQ=null;
function vocabPool(){
  const ws=(dashData&&dashData.vocabList||[]).filter(v=>v.w&&v.ja&&v.w.trim().toLowerCase()!=="new word");
  return ws;
}
function offlineAsk(){
  const ws=vocabPool();
  if(ws.length<3) return "いまオフラインだけど大丈夫！ダッシュボードに単語を3つ以上入れてくれたら、キキが出題できるよ。";
  const L=(dashData&&dashData.leitner)||{};
  const st=w=>L[String(w||"").trim().toLowerCase()]||{wrong:0,mastered:false};
  const weak=ws.filter(v=>!st(v.w).mastered).sort((a,b)=>st(b.w).wrong-st(a.w).wrong);
  const pick=(weak.length?weak:ws).slice(0,8);
  const v=pick[Math.floor(Math.random()*pick.length)];
  const others=ws.filter(x=>x.w!==v.w).sort(()=>Math.random()-0.5).slice(0,2);
  const opts=[v,...others].sort(()=>Math.random()-0.5);
  offQ={ans:v,opts};
  return v.w+" の意味は？ "+opts.map((o,i)=>(i+1)+") "+o.ja).join("　");
}
function offlineReply(text){
  if(offQ){
    const q=offQ; offQ=null;
    const m=String(text).match(/[1-3１-３]/);
    let chosen=null;
    if(m){ const n="123".indexOf(m[0].replace(/１/,"1").replace(/２/,"2").replace(/３/,"3")); if(n>=0) chosen=q.opts[n]; }
    const ok = chosen ? chosen.ja===q.ans.ja : String(text).includes(q.ans.ja);
    const head = ok ? "⭕ せいかい！ナイス！" : ("✕ おしい！ "+q.ans.w+" は「"+q.ans.ja+"」だよ。");
    return head+"　つぎいくよ！　"+offlineAsk();
  }
  return offlineAsk();
}
function failMsg(e){
  const s=String((e&&e.message)||e||"").toLowerCase();
  if(/credit|balance|insufficient|quota|payment|402/.test(s))
    return "キキのAIクレジットが切れちゃったみたい💦 puter.com にログインして残高を足してね。<br>でも大丈夫！このままオフラインで単語クイズできるよ👇";
  if(/401|403|unauthorized|auth|sign|login/.test(s))
    return "AIのログインが切れてるみたい。puter.com でログインし直してね。<br>それまではオフラインで単語クイズしよっか👇";
  if(/network|fetch|timeout|econn/.test(s))
    return "ネットが不安定みたい📶 電波のいいところで試してね。<br>今はオフラインで単語クイズできるよ👇";
  return "ちょっと調子が悪いみたい…でも止まらないよ！オフラインで単語クイズしよっか👇";
}
function handleFail(e){
  offlineMode=true;
  addMsg("kiki", failMsg(e));
  const q=offlineReply("");
  addMsg("kiki", q);
  speak(q.replace(/<[^>]+>/g,""));
  setStatus("🟡 オフラインモード（単語クイズは使えるよ）");
}

/* ---------- AI ---------- */
const MODELS = ["gpt-4o-mini", "gpt-4.1-mini", "gpt-4o", "claude-sonnet-4"];
let goodModel = null;
function extractText(resp){
  let c = resp?.message?.content ?? resp?.text ?? resp;
  if(Array.isArray(c)) c = c.map(p=>p.text||"").join("");
  return (typeof c === "string" ? c : String(c||"")).trim();
}
async function aiChat(msgs){
  const tries = goodModel ? [goodModel] : MODELS;
  for(const m of tries){
    try{ const r = await puter.ai.chat(msgs, {model:m}); const t = extractText(r); if(t){ goodModel = m; return t; } }catch(e){}
  }
  const r = await puter.ai.chat(msgs); // default fallback
  return extractText(r);
}

async function chat(userText){
  if(busy) return; busy = true;
  pauseRec();
  addMsg("miku", userText);
  messages.push({role:"user", content:userText});
  setStatus("キキ先生、考え中… 🧹"); setInterim("");
  avatarState("thinking");
  try{
    const text = offlineMode ? offlineReply(userText) : await aiChat([{role:"system", content:buildSystem()}, ...messages.slice(-20)]);
    messages.push({role:"assistant", content:text});
    addMsg("kiki", text);
    busy = false;
    await speak(text);
    turns++;
    if(turns % 3 === 0) updateMemory();
  }catch(e){
    busy = false;
    handleFail(e);
    afterSpeech();
  }
}

async function updateMemory(){
  try{
    const newMem = await aiChat([
      {role:"system", content:"あなたはミク専属チューター「キキ先生」の記録係。既存メモと直近の会話から学習カルテを更新して出力。必ず【強み】【弱点】【マスターしたこと】【次の練習】【プライベート近況】の5見出し、箇条書き、日本語、600字以内、メモのみ出力。★弱点は必ず具体名で書く（単語名＋章番号。例: imply と infer の混同（第12章））。★前回から改善した項目は弱点から消して【マスターしたこと】へ移す。★【次の練習】には必ず「3〜5ターン後に再出題する項目」を1つ書く。"},
      {role:"user", content:"既存メモ:\n"+(memory||"(なし)")+"\n\n直近の会話:\n"+messages.slice(-8).map(m=>(m.role==="user"?"ミク: ":"キキ: ")+m.content).join("\n")}
    ]);
    if(newMem){ memory = newMem; await fetch(MEMORY_URL, {method:"POST", headers:{"Content-Type":"text/plain"}, body:newMem}); }
  }catch(e){}
}

/* ---------- NATURAL VOICE (Puter TTS: generative → neural → standard → browser) ---------- */
const ttsEngineCache = {};
function langRuns(text){
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").replace(/[*#_`「」『』]/g,"").trim();
  const sents = clean.split(/(?<=[。．！？!?\.])\s*/).filter(s=>s.trim());
  const runs = [];
  for(const s of sents){
    const ja = /[぀-ヿ一-龯]/.test(s);
    if(runs.length && runs[runs.length-1].ja===ja) runs[runs.length-1].text += " " + s;
    else runs.push({ja, text:s});
  }
  return runs;
}
async function fetchTTS(run){
  const lang = run.ja ? "ja-JP" : "en-US";
  const plans = ttsEngineCache[lang] ? [ttsEngineCache[lang]] : [
    {engine:"generative", voice: run.ja ? "Kazuha" : "Ruth"},
    {engine:"neural",     voice: run.ja ? "Kazuha" : "Joanna"},
    {engine:"standard",   voice: run.ja ? "Mizuki" : "Joanna"},
  ];
  for(const p of plans){
    try{
      const audio = await puter.ai.txt2speech(run.text, {language:lang, voice:p.voice, engine:p.engine});
      if(audio){ ttsEngineCache[lang] = p; return audio; }
    }catch(e){}
  }
  return null;
}
function playAudio(audio, token){
  return new Promise(res=>{
    if(token !== speechToken) return res();
    currentAudio = audio;
    audio.onended = ()=>res(); audio.onerror = ()=>res();
    audio.play().catch(()=>res());
  });
}
function browserTTS(run){
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(run.text);
    u.lang = run.ja ? "ja-JP" : "en-US"; u.rate = run.ja?1.08:1.0; u.pitch = 1.12;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speak(text){
  if(!voiceOn){ afterSpeech(); return; }
  const runs = langRuns(text);
  if(!runs.length){ afterSpeech(); return; }
  const token = ++speechToken;
  speaking = true; pauseRec();
  avatarState("speaking"); setStatus("キキ先生が話しています 🔊");
  let next = fetchTTS(runs[0]);
  for(let i=0; i<runs.length; i++){
    if(token !== speechToken) break;
    const audio = await next;
    if(i+1 < runs.length) next = fetchTTS(runs[i+1]);
    if(token !== speechToken) break;
    if(audio) await playAudio(audio, token);
    else await browserTTS(runs[i]);
  }
  if(token === speechToken){ speaking = false; afterSpeech(); }
}
function stopSpeaking(){
  speechToken++;
  speaking = false;
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  speechSynthesis.cancel();
}
function bargeIn(){
  if(speaking){ stopSpeaking(); avatarState("listening"); afterSpeech(); }
}

/* ---------- ALWAYS-ON EARS ---------- */
function makeRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = recLang; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
  r.onresult = e => {
    let interim = "", final = "";
    for(const res of e.results){ (res.isFinal ? final : interim) && 0; if(res.isFinal) final += res[0].transcript; else interim += res[0].transcript; }
    if(interim) setInterim("💬 " + interim);
    if(final){
      setInterim("");
      const t = final.trim();
      if(t.length > 1 && !busy && !speaking) chat(t);
    }
  };
  r.onend = ()=> { recActive = false; if(liveMode && !busy && !speaking) setTimeout(listen, 200); else if(!liveMode) avatarState("idle"); };
  r.onerror = e => {
    recActive = false;
    if(e.error === "not-allowed"){ liveMode = false; updateLiveBtn(); setStatus("🎤 マイクを許可してね（アドレスバーの鍵マーク→マイク→許可）。キーボード入力でもOK！"); }
  };
  return r;
}
function listen(){
  if(!liveMode || busy || speaking || recActive) return;
  rec = makeRec();
  if(!rec){ setStatus("このブラウザは音声認識非対応です。ChromeかSafariで開いてね"); liveMode=false; updateLiveBtn(); return; }
  try{ rec.start(); recActive = true; }catch(e){ recActive = false; return; }
  avatarState("listening");
  setStatus(recLang==="ja-JP" ? "聞いてるよ、いつでもどうぞ 👂" : "I'm listening... go ahead! 👂");
}
function pauseRec(){ if(rec){ try{ rec.abort(); }catch(e){} } recActive = false; }
function afterSpeech(){
  avatarState("idle");
  if(liveMode){ setTimeout(listen, 300); }
  else setStatus("「会話スタート」でいつでも呼んでね 🧹");
}

/* ---------- CONTROLS ---------- */
const GREETINGS = [
  "ミクちゃん、きたきたー！キキだよ。今日は何から飛ぶ？発音？プレゼン？それともバイトの愚痴から？",
  "よっ、ミクちゃん！ジジも待ってたよ。今日の調子、ひとことで言うと？",
  "ミクちゃん、おかえり！さあ、ほうきに乗って。今日はどこまで飛ぼっか？",
];
function toggleLive(){
  if(liveMode){
    liveMode = false; stopSpeaking(); pauseRec(); updateLiveBtn();
    setStatus("会話終了。またね！ 🧹"); avatarState("idle");
  } else {
    liveMode = true; updateLiveBtn();
    const g = GREETINGS[Math.floor(Math.random()*GREETINGS.length)];
    if(messages.length === 0){
      addMsg("kiki", g);
      messages.push({role:"assistant", content:g});
      speak(g);           // user gesture unlocks audio; listening auto-starts after
    } else {
      listen();
    }
  }
}
function updateLiveBtn(){
  const b = document.getElementById("liveBtn");
  b.textContent = liveMode ? "⏹ 会話をおわる" : "🎙 会話スタート";
  b.classList.toggle("on", liveMode);
}
function toggleLang(){
  recLang = recLang==="ja-JP" ? "en-US" : "ja-JP";
  document.getElementById("langBtn").classList.toggle("on", recLang==="ja-JP");
  document.getElementById("langBtnEn").classList.toggle("on", recLang==="en-US");
  if(liveMode && !speaking && !busy){ pauseRec(); setTimeout(listen, 150); }
}
function toggleVoice(){
  voiceOn = !voiceOn;
  const b = document.getElementById("voiceBtn");
  b.textContent = voiceOn ? "🔊 声: ON" : "🔇 声: OFF";
  b.classList.toggle("on", voiceOn);
  if(!voiceOn) stopSpeaking();
}
function sendText(){
  const el = document.getElementById("textIn");
  const t = el.value.trim(); if(!t) return;
  el.value = ""; stopSpeaking(); chat(t);
}
addMsg("kiki", "こんにちは、ミクちゃん！🧹 下の「会話スタート」を1回押したら、あとはずーっとおしゃべりできるよ。マイクは押さなくてOK！");
</script>
